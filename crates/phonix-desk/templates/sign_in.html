{% extends "plain.html" %}

{% block card %}
{% include "_banner.html" %}

<div class="panel p-4">
  <h2 class="text-base font-semibold">Sign in</h2>
  <p class="mt-0.5 text-sm text-content-muted">Sign in to run the platform.</p>

  <form method="post" action="/sign-in" class="mt-4 flex flex-col gap-3">
    <div>
      <label for="email" class="mb-1 block text-sm font-medium">Email</label>
      <input id="email" name="email" type="email" autocomplete="username" required autofocus>
    </div>
    <div>
      <label for="password" class="mb-1 block text-sm font-medium">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
    </div>
    <div>
      <button class="btn" type="submit">Continue</button>
    </div>
    <p class="text-xs text-content-muted">You will be asked for a code from your authenticator next.</p>
  </form>
</div>
{% endblock %}
