[package]
name = "phonix-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "phonix-server"
path = "src/main.rs"

[dependencies]
phonix-core = { workspace = true }
phonix-config = { workspace = true }
phonix-telemetry = { workspace = true }
# Optional, and the strong half of the profiler's gate: without
# `--features profiler` the crate is not in the binary, so the routes cannot
# exist. See docs/adr/0004-development-profiler.md section 8.
phonix-profiler = { workspace = true, optional = true }
phonix-db = { workspace = true }
phonix-services = { workspace = true }
secrecy = { workspace = true }
phonix-cache = { workspace = true }
phonix-messaging = { workspace = true }
phonix-storage = { workspace = true }
# The Leptos app, compiled for the server.
phonix-web = { workspace = true, features = ["ssr"] }

leptos = { workspace = true, features = ["ssr"] }
leptos_axum = { workspace = true }
leptos_meta = { workspace = true, features = ["ssr"] }
leptos_router = { workspace = true, features = ["ssr"] }

axum = { workspace = true }
# Session cookies are built through `phonix_web::server::cookie`; the Google
# flow's short-lived cookie is built here, next to the two handlers that are
# the only things that ever read it.
cookie = { workspace = true }
# Percent-encoding for the handoff token in a redirect built here.
form_urlencoded = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
http = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
# Streaming a stored file back to the browser without loading it into memory.
tokio-stream = { version = "0.1", features = ["io-util"] }
futures = { workspace = true }

# The public API and its specification. Server-only, by design: see the note
# in the workspace manifest.
utoipa = { workspace = true }
utoipa-axum = { workspace = true }
utoipa-scalar = { workspace = true }

anyhow = { workspace = true }
# Timestamps on the API's wire types. `utoipa`'s chrono feature is what turns a
# `DateTime<Utc>` into `string`/`date-time` in the document, but the type still
# has to be nameable here.
chrono = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true, features = ["v4", "v7"] }
tracing = { workspace = true }

[features]
# cargo-leptos passes --features ssr to the bin package; the binary is
# server-only, so the flag simply has nothing extra to switch on.
ssr = []
# The development profiler. Not in `default`: a build has to ask for it, and a
# production build never does. `config/development.toml` turns it on, but this
# is what decides whether there is anything to turn on.
profiler = ["dep:phonix-profiler"]
