[package]
name = "phonix-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "phonix-server"
path = "src/main.rs"

[dependencies]
phonix-core = { workspace = true }
phonix-config = { workspace = true }
phonix-telemetry = { workspace = true }
# Optional, and the strong half of the profiler's gate: without the `profiler`
# feature the crate is not in the binary, so the routes cannot exist. The
# workspace's `bin-features` turns it on for development builds and
# `phonix-deploy` turns it back off for the release it installs.
# See docs/adr/0004-development-profiler.md section 8.
phonix-profiler = { workspace = true, optional = true }
phonix-db = { workspace = true }
phonix-services = { workspace = true }
secrecy = { workspace = true }
phonix-cache = { workspace = true }
phonix-messaging = { workspace = true }
phonix-storage = { workspace = true }
# The Leptos app, compiled for the server.
phonix-web = { workspace = true, features = ["ssr"] }

leptos = { workspace = true, features = ["ssr"] }
leptos_axum = { workspace = true }
leptos_meta = { workspace = true, features = ["ssr"] }
leptos_router = { workspace = true, features = ["ssr"] }

axum = { workspace = true }
# Session cookies are built through `phonix_web::server::cookie`; the Google
# flow's short-lived cookie is built here, next to the two handlers that are
# the only things that ever read it.
cookie = { workspace = true }
# Percent-encoding for the handoff token in a redirect built here.
form_urlencoded = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
http = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
# Streaming a stored file back to the browser without loading it into memory.
tokio-stream = { version = "0.1", features = ["io-util"] }
futures = { workspace = true }

# The public API and its specification. Server-only, by design: see the note
# in the workspace manifest.
utoipa = { workspace = true }
utoipa-axum = { workspace = true }
utoipa-scalar = { workspace = true }

anyhow = { workspace = true }
# Timestamps on the API's wire types. `utoipa`'s chrono feature is what turns a
# `DateTime<Utc>` into `string`/`date-time` in the document, but the type still
# has to be nameable here.
chrono = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true, features = ["v4", "v7"] }
tracing = { workspace = true }

[dev-dependencies]
# `util` is what carries `ServiceExt::oneshot`, which drives a `Router` as a
# plain function from request to response. It is a dev-dependency because it
# buys nothing at runtime: the server never calls a router directly.
#
# This is the cheap rung of the ladder. Asking "is /_profiler mounted?" through
# a real `cargo leptos watch` costs a wasm build, a link and a boot, and the
# answer is a status code either way.
tower = { workspace = true, features = ["util"] }

[features]
# cargo-leptos passes --features ssr to the bin package; the binary is
# server-only, so the flag simply has nothing extra to switch on.
ssr = []
# The development profiler. Not in `default`, because the build that matters
# is cargo-leptos's and it is told explicitly either way: the workspace's
# `bin-features` asks for this, and `phonix-deploy` overrides that list to drop
# it. `profiler.enabled` decides whether a build that has it collects anything.
profiler = ["dep:phonix-profiler"]
