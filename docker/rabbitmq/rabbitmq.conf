# ===========================================================================
# Phonix - RabbitMQ configuration (sysctl format, RabbitMQ 4.x)
#
# The default user/pass/vhost come from docker-compose environment variables
# (RABBITMQ_DEFAULT_USER / _PASS / _VHOST), so no credentials live here.
#
# Exchanges, queues and bindings are NOT declared here. The application
# declares its own topology idempotently at startup (see phonix-messaging),
# which keeps one source of truth in version control.
# ===========================================================================

# --- Listeners --------------------------------------------------------------
listeners.tcp.default = 5672
management.tcp.port = 15672

# --- Memory & disk watermarks -----------------------------------------------
# Block publishers when the broker exceeds 60% of available RAM. On a dev
# laptop this prevents RabbitMQ from starving Postgres and the compiler.
vm_memory_high_watermark.relative = 0.6
vm_memory_high_watermark_paging_ratio = 0.75

# Refuse writes when free disk drops below this. 2GB is generous for local use.
disk_free_limit.absolute = 2GB

# --- Connection behaviour ---------------------------------------------------
# Heartbeat must be compatible with the client's setting (rabbitmq.heartbeat_secs
# in config/base.toml). The lower of the two values wins.
heartbeat = 60
frame_max = 131072
channel_max = 2047

# Drop connections that never authenticate.
handshake_timeout = 10000

# --- Durability defaults ----------------------------------------------------
# Classic queues v2 are the modern default: better memory behaviour under load.
classic_queue.default_version = 2

# Consumers that never ack will be disconnected after this long. Guards against
# a wedged worker silently holding messages forever. 30 minutes.
consumer_timeout = 1800000

# --- Logging ----------------------------------------------------------------
# Log to the container's stdout so `docker compose logs -f rabbitmq` works and
# Docker's json-file driver handles rotation.
log.console = true
log.console.level = info
log.console.formatter = plaintext
log.file = false

# --- Management UI ----------------------------------------------------------
# http://localhost:15672  (credentials = RABBITMQ_USER / RABBITMQ_PASSWORD)
management.rates_mode = basic

# --- Prometheus -------------------------------------------------------------
# Scrape http://localhost:15692/metrics
prometheus.return_per_object_metrics = false

# --- Defaults applied only on FIRST boot (empty data directory) --------------
# Full permissions for the app user on its own vhost.
default_permissions.configure = .*
default_permissions.read = .*
default_permissions.write = .*
default_user_tags.administrator = true

# Reject the well-known guest account over any non-loopback interface.
loopback_users.guest = true
