# ===========================================================================
# Phonix - Redis configuration (cache role)
# The password is NOT here; docker-compose passes --requirepass from .env.
# ===========================================================================

bind 0.0.0.0
port 6379
protected-mode yes

# --- Memory -----------------------------------------------------------------
# Phonix uses Redis as a cache, so a bounded heap with LRU eviction is correct.
# Raise this once you know your working set; 256mb is a sane laptop default.
maxmemory 256mb
maxmemory-policy allkeys-lru
maxmemory-samples 5

# --- Persistence ------------------------------------------------------------
# A cache does not need durability, but keeping a cheap RDB snapshot means a
# container restart does not cold-start every tenant at once.
# "save <seconds> <changes>"
save 900 1
save 300 100
dbfilename phonix-cache.rdb
dir /data
appendonly no
stop-writes-on-bgsave-error no
rdbcompression yes
rdbchecksum yes

# --- Clients / networking ---------------------------------------------------
timeout 0
tcp-keepalive 300
tcp-backlog 511
maxclients 1000

# --- Safety -----------------------------------------------------------------
# Commands that make it trivial to nuke or stall the cache from the app.
rename-command FLUSHALL ""
rename-command FLUSHDB ""
rename-command KEYS ""
rename-command CONFIG ""

# --- Slow query log ---------------------------------------------------------
# Log commands taking longer than 10ms; inspect with SLOWLOG GET.
slowlog-log-slower-than 10000
slowlog-max-len 128

# --- Logging ----------------------------------------------------------------
loglevel notice
logfile ""

# --- Keyspace notifications -------------------------------------------------
# "Ex" = expired-key events. Enable if you want the app to react to evictions.
notify-keyspace-events ""

databases 16
